<!DOCTYPE html>
<html lang="en">
<head>
    <script type="importmap">
        {
            "imports": {
                "@sentry/browser": "https://esm.sh/@sentry/browser"
            }
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Burgas Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fontello.css">
</head>
<body>

<button id="mobile-filter-btn" class="mobile-only">
    <span class="btn-state-default" style="display: flex;">
        <span class="icon-cog"></span> <span data-i18n="filters">Филтри</span>
    </span>

    <span class="btn-state-active" style="display: none;">
        <span>×</span> <span data-i18n="close">Затвори</span>
    </span>
</button>

<div id="controls">
    <button id="close-controls" class="mobile-only">×</button>
    <div class="lang-switcher-wrapper">
        <!-- Bulgarian Option -->
        <input type="radio" name="lang" id="bg" value="bg" checked>
        <label for="bg" class="lang-option">
            <span class="flag" data-flag="bg"><img src="images/bg-web.png" alt="BG"></span>
            <span data-i18n="bg">БГ</span>
        </label>

        <!-- English Option -->
        <input type="radio" name="lang" id="en" value="en">
        <label for="en" class="lang-option">
            <span class="flag" data-flag="en"><img src="images/en-web.png" alt="EN"></span>
            <span data-i18n="en">АНГЛ</span>
        </label>

        <!-- The animated background slider -->
        <div class="selection-pill"></div>
    </div>

    <hr>

    <div class="bulk-controls">
        <a href="#" id="btn-select-all" class="active" data-i18n="select_all">Избери всички</a>
        <span> | </span>
        <a href="#" id="btn-deselect-all" data-i18n="deselect_all">Отмаркирай всички</a>
    </div>

    <div id="region-filters" class="region-controls">
        <h4 data-i18n="regions">Региони</h4>
        <div id="region-filters-wrapper" class="wrapper"></div>
    </div>

    <div id="paid-parking-zones-filters" class="region-controls">
        <h4 data-i18n="layer_paid_parking_zones">Платени зони за паркиране</h4>
        <div id="paid-parking-zones-wrapper" class="wrapper"></div>
    </div>

    <h4 data-i18n="filters">Филтри</h4>
    <ul>
        <li>
            <label class="checkbox" for="toggle-air-quality-time">
                <input type="checkbox" id="toggle-air-quality-time">
                <span class="checkbox__checkmark"></span>
                <span class="checkbox__body">
                    <span class="icon-air"></span>
                    <span data-i18n="layer_air_quality">Качество на въздуха</span>
                </span>
                <span id="air-quality-time" class="timestamp">-</span>
            </label>
        </li>
        <li>
            <label class="checkbox" for="toggle-traffic">
                <input type="checkbox" id="toggle-traffic">
                <span class="checkbox__checkmark"></span>
                <span class="checkbox__body">
                    <span class="icon-car"></span>
                    <span data-i18n="layer_traffic">Трафик камери</span>
                </span>
                <span id="traffic-time" class="timestamp">-</span>
            </label>
        </li>
        <li>
            <label class="checkbox" for="toggle-cctv">
                <input type="checkbox" id="toggle-cctv">
                <span class="checkbox__checkmark"></span>
                <span class="checkbox__body" >
                    <span class="icon-videocam"></span>
                    <span data-i18n="layer_camera">Камери</span>
                </span>
                <span id="cctv-time" class="timestamp">-</span>
            </label>
        </li>
        <li>
            <label class="checkbox" for="toggle-billing-machines">
                <input type="checkbox" id="toggle-billing-machines">
                <span class="checkbox__checkmark"></span>
                <span class="checkbox__body">
                    <span class="icon-dollar"></span>
                    <span data-i18n="layer_billing_machines">Банкомати</span>
                </span>
                <span id="billing-time" class="timestamp">-</span>
            </label>
        </li>
        <li>
            <label class="checkbox" for="toggle-ev-stations">
                <input type="checkbox" id="toggle-ev-stations">
                <span class="checkbox__checkmark"></span>
                <span class="checkbox__body">
                    <span class="icon-battery"></span>
                    <span data-i18n="layer_ev_charging">Зареждане на ел. превозни средства</span>
                </span>
                <span id="ev-time" class="timestamp">-</span>
            </label>
        </li>
        <li>
            <label class="checkbox" for="toggle-waste">
                <input type="checkbox" id="toggle-waste">
                <span class="checkbox__checkmark"></span>
                <span class="checkbox__body">
                    <span class="icon-recycle"></span>
                    <span data-i18n="layer_mobile_waste">Мобилни центрове за отпадъци</span>
                </span>
                <span id="waste-time" class="timestamp">-</span>
            </label>
        </li>
        <li>
            <label class="checkbox" for="toggle-smart-parking">
                <input type="checkbox" id="toggle-smart-parking">
                <span class="checkbox__checkmark"></span>
                <span class="checkbox__body">
                    <span class="icon-car-parking"></span>
                    <span data-i18n="layer_smart_parking">Смарт Паркинги</span>
                </span>
                <span id="smart-car-parking-time" class="timestamp">-</span>
            </label>
        </li>
        <li>
            <label class="checkbox" for="toggle-taxi">
                <input type="checkbox" id="toggle-taxi">
                <span class="checkbox__checkmark"></span>
                <span class="checkbox__body">
                    <span class="icon-taxi-sign_76588"></span>
                    <span data-i18n="layer_taxi_stands">Стоянки на таксита</span>
                </span>
                <span id="taxi-time" class="timestamp">-</span>
            </label>
        </li>
    </ul>
</div>

<div id="map"></div>

<div id="info-panel" class="hidden">
    <div id="info-panel-container">
        <button id="close-panel">×</button>
        <div id="info-content">
            <p></p>
        </div>
        <div id="chart-container">
            <p id="no-chart-data" class="hidden" data-i18n="no_chart_data">Няма данни за диаграма.</p>
        </div>
        <div class="actions">
            <button class="action-btn btn-download-csv">
                <span class="icon-download"></span> <span data-i18n="download_csv">Свали като CSV</span>
            </button>
            <button id="btn-full-chart" class="action-btn hidden" >
                <span class="icon-resize-full"></span> <span data-i18n="full_screen_chart">Диаграма на цял екран</span>
            </button>
        </div>
    </div>
</div>

<div id="chart-modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-title" data-i18n="chart">Диаграма</h2>
            <div class="modal-header-actions">
                <button class="action-btn btn-download-csv">
                    <span class="icon-download"></span> <span data-i18n="download_csv">Свали като CSV</span>
                </button>
                <button id="close-modal">×</button>
            </div>
        </div>
        <div id="full-chart-container"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<script type="module" src="/js/Client.js"></script>
</body>
</html>
