name: Build and Push Docker Image

on:
  push:
    # Triggers when you push version tags (e.g., v1.0.0)
    tags: [ 'v*.*.*' ]

env:
  # The GitHub Container Registry URL
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # TEST THE APPLICATION
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Backend & Unit Tests (Vitest)
        run: npm test

      - name: Install Playwright Browsers (Chromium only to save time/CPU)
        run: npx playwright install --with-deps chromium

      - name: Run Frontend UI Tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure() # ONLY upload if the E2E tests fail
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7 # Automatically deletes after 1 week to save storage
  build:
    needs: test # run if 'test' passes successfully
    runs-on: ubuntu-latest
    # These permissions are required for GitHub Actions to push the image securely
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is a temporary password automatically provided by GitHub
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # This automatically tags image with the tag version number
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # CLEANUP OLD DOCKER IMAGES
  cleanup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write # Required to delete packages
    steps:
      - name: Delete old images
        uses: snok/container-retention-policy@v2
        with:
          image-names: ${{ github.event.repository.name }}
          cut-off: 30 days ago # Keeps images less than 30 days old
          keep-at-least: 3 # Always keep the 3 most recent images
          account-type: personal # Or 'org' for organization repo
          token: ${{ secrets.GITHUB_TOKEN }}